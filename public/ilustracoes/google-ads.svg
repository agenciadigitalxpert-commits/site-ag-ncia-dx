<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <linearGradient id="face" x2="0.78" y2="1">
      <stop stop-color="#303032" /><stop offset=".52" stop-color="#151516" /><stop offset="1" stop-color="#0A0A0B" />
    </linearGradient>
    <linearGradient id="edge" x2=".52" y2="1">
      <stop stop-color="#202022" /><stop offset="1" stop-color="#0A0A0B" />
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#fff" stop-opacity=".075" /><stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shadow">
      <stop stop-color="#000" stop-opacity=".87" /><stop offset="1" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  <mask id="oc1" maskUnits="userSpaceOnUse" x="-100" y="-100" width="600" height="600"><rect x="-100" y="-100" width="600" height="600" fill="#fff" /><rect x="63" y="105" width="274" height="59" rx="28" fill="#000" stroke="#000" stroke-width="1.3" /></mask></defs>
  <style>
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sh{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9);opacity:.75}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes draw{0%{stroke-dashoffset:1}30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
.f{animation:f 6s ease-in-out infinite}
.f2{animation:f 6s ease-in-out -3s infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 6s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.type{transform-box:fill-box;transform-origin:0 50%;animation:type 5s steps(18,end) infinite}@keyframes type{0%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}.caret{animation:blink 1s steps(1) infinite}.row{animation:row 5s cubic-bezier(.2,0,0,1) infinite}@keyframes row{0%,38%{transform:translateY(10px);opacity:0}52%,100%{transform:none;opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}</style>
  <circle cx="200" cy="192" r="179" fill="url(#glow)" />
  <g mask="url(#oc1)"><g class="row" style="animation-delay:0.50s"><rect x="89" y="188" width="222" height="26" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.3" /></g><g class="row" style="animation-delay:0.50s"><path d="M132 201h123" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2.6" /></g><g class="row" style="animation-delay:0.65s"><rect x="94" y="223" width="212" height="26" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.3" /></g><g class="row" style="animation-delay:0.65s"><path d="M137 236h110" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2.6" /></g><g class="row" style="animation-delay:0.80s"><rect x="99" y="258" width="202" height="26" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.3" /></g><g class="row" style="animation-delay:0.80s"><path d="M142 271h97" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="2.6" /></g><rect class="pulse" x="102" y="196" width="22" height="10" rx="5" fill="#EEEEEB" stroke="#ffffff" stroke-opacity="0" stroke-width="1.3" /></g><rect x="63" y="105" width="274" height="59" rx="28" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.43" stroke-width="1.3" /><circle cx="96" cy="132" r="10" fill="none" stroke="#ffffff" stroke-opacity="0.73" stroke-width="1.3" /><path d="M104 139l8 8M125 115V153" fill="none" stroke="#ffffff" stroke-opacity="0.48" stroke-width="2.4" /><path class="type" d="M144 134H279" fill="none" stroke="#ffffff" stroke-opacity="0.48" stroke-width="2.4" /><path class="caret" d="M286 122V146" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2" />
</svg>
.f{animation:f 6s ease-in-out infinite}
.f2{animation:f 6s ease-in-out -3s infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 6s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.cta{transform-box:fill-box;transform-origin:center;animation:cta 4.5s ease-in-out infinite}@keyframes cta{0%,52%,64%,100%{transform:scale(1)}58%{transform:scale(.92)}}.cur{animation:cur 4.5s cubic-bezier(.4,0,.2,1) infinite}@keyframes cur{0%,100%{transform:translate(70px,60px);opacity:0}15%{opacity:1}50%,66%{transform:translate(0,0)}58%{transform:translate(0,0) scale(.9)}85%{opacity:1}}.card{animation:f 6s ease-in-out infinite}.c1{animation-delay:-2s}.c2{animation-delay:-4s}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}</style>

.mark{transform-box:fill-box;transform-origin:50% 0;animation:mark 4s cubic-bezier(.2,0,0,1) infinite}@keyframes mark{0%,100%{transform:scaleY(1)}45%{transform:scaleY(1.22)}60%{transform:scaleY(.94)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}</style>

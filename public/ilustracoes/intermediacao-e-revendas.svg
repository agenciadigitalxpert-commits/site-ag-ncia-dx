@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes draw{0%{stroke-dashoffset:1}30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
.f{animation:f 6s ease-in-out infinite}
.f2{animation:f 6s ease-in-out -3s infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 6s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.swing{transform-origin:302px 67px;animation:swing 3.6s ease-in-out infinite}@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}.wheel{animation:spin 1.6s linear infinite}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-1.5px)}}.road{animation:road .8s linear infinite}@keyframes road{to{stroke-dashoffset:28}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}</style>

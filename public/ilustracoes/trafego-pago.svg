<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <linearGradient id="face" x2="0.78" y2="1">
      <stop stop-color="#303032" /><stop offset=".52" stop-color="#151516" /><stop offset="1" stop-color="#0A0A0B" />
    </linearGradient>
    <linearGradient id="edge" x2=".52" y2="1">
      <stop stop-color="#202022" /><stop offset="1" stop-color="#0A0A0B" />
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#fff" stop-opacity=".075" /><stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shadow">
      <stop stop-color="#000" stop-opacity=".87" /><stop offset="1" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  <mask id="oc1" maskUnits="userSpaceOnUse" x="-100" y="-100" width="600" height="600"><rect x="-100" y="-100" width="600" height="600" fill="#fff" /><circle cx="200" cy="193" r="122" fill="#000" stroke="#000" stroke-width="1.3" /></mask></defs>
  <style>
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sh{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9);opacity:.75}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes draw{0%{stroke-dashoffset:1}30%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
.f{animation:f 6s ease-in-out infinite}
.f2{animation:f 6s ease-in-out -3s infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 6s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.sweep{transform-origin:200px 193px;animation:spin 5s linear infinite}.blip{transform-box:fill-box;transform-origin:center;animation:blip 5s ease-out infinite;animation-delay:.6s}.b2{animation-delay:3.1s}@keyframes blip{0%{transform:scale(1);opacity:.5}6%{transform:scale(2.4);opacity:1}40%,100%{transform:scale(1);opacity:.5}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}</style>
  <circle cx="200" cy="192" r="179" fill="url(#glow)" />
  <g mask="url(#oc1)"><circle cx="203" cy="206" r="122" fill="none" stroke="#ffffff" stroke-opacity="0.27" stroke-width="1.3" /></g><circle cx="200" cy="193" r="122" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.36" stroke-width="1.3" /><circle cx="200" cy="193" r="98" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1.3" /><circle cx="200" cy="193" r="72" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1.3" /><circle cx="200" cy="193" r="44" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1.3" /><path d="M78 193H322M200 71V315" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.4" /><path class="sweep" d="M200 193V72A121 121 0 0 1 285 107Z" fill="#fff" stroke="none" stroke-opacity="0.46" fill-opacity=".09" /><circle class="pulse" cx="200" cy="193" r="9" fill="#C8F53C" stroke="#ffffff" stroke-opacity="0" stroke-width="1.3" /><circle class="blip" cx="251" cy="146" r="3" fill="#ccc" stroke="#ffffff" stroke-opacity="0" stroke-width="1.3" /><circle class="blip b2" cx="146" cy="231" r="3" fill="#aaa" stroke="#ffffff" stroke-opacity="0" stroke-width="1.3" />
</svg>
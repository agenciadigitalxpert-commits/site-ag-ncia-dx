.sh{transform-box:fill-box;transform-origin:center;animation:sh 6s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.spoke{stroke-dasharray:4 6;animation:dash 1.6s linear infinite}.node{transform-box:fill-box;transform-origin:center;animation:node 2.1s ease-in-out infinite}@keyframes node{0%,100%{transform:scale(1)}20%{transform:scale(1.18)}40%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}</style>

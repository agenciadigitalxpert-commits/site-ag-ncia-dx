.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.ring{transform-origin:0 0;animation:ring 3.2s ease-out infinite}.r2{animation-delay:-1.6s}@keyframes ring{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.35);opacity:0}}.drop{animation:drop 3.2s cubic-bezier(.3,0,.3,1) infinite}@keyframes drop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}55%{transform:translateY(2px)}65%{transform:translateY(0)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}</style>
